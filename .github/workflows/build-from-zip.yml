name: Build APKs from ZIP
on:
  push:
    paths: ["FakeBadSignal.zip", ".github/workflows/build-from-zip.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          mkdir project
          unzip -q FakeBadSignal.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FakeBadSignal-APKs
          path: |
            ${{ env.PROJECT_DIR }}/fakebadsignal/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/backgroundsounds/build/outputs/apk/debug/*.apk
