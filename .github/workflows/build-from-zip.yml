name: Build APK from ZIP
on:
  push:
    paths: ["TroubleCall.zip", ".github/workflows/build-from-zip.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          mkdir project
          unzip -q TroubleCall.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TroubleCall-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
